<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenie | Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="login-container">
        <h1 align="center">Login</h1>
        <form id="loginForm">
            <label>Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required>

            <label>Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>

            <button type="submit">Login</button>
            <p id="message"></p>
            <label>Don't have an account? <a href="register.html">Register Here</a></label>
        </form>
    </div>

    <script src="../backend/login.js"></script>
    <footer style="text-align: center; margin-top: 20px; padding: 10px; font-size: 14px; color: #666;">
        &copy; 2026 Jenie. All rights reserved.
    </footer>
</body>

</html>
